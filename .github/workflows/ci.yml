name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    # Windows is the primary supported platform; paths, process spawning and Git worktrees are tested there.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # Unit + integration tests use FakeAgentRuntime only. The real-SDK smoke test
      # (pnpm smoke:claude) is manual and never runs here.
      - run: pnpm test
      - run: pnpm build
