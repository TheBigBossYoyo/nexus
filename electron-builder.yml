appId: dev.nexus.controlplane
productName: NEXUS
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  # Only the Windows x64 runtime binary ships; other platform packages are not installed on Windows.
  - "!**/node_modules/@anthropic-ai/claude-agent-sdk-{darwin,linux}*/**"
  - "!**/*.map"
  # The runtime hosted by plain Node exists for tests; it is not part of the app.
  - "!out/main/runtime-node.js"
  - "!out/validation/**"
  - "!**/better-sqlite3/{deps,src}/**"
  # The SQLite binding for other systems: a Windows package has no use for them.
  - "!**/better-sqlite3/prebuilds/{darwin,linux,linuxmusl}-*"
  - "!**/better-sqlite3/prebuilds/win32-arm64.node"
# The built-in Arena cases (fixtures and hidden evaluators) are plain files NEXUS copies and executes.
extraResources:
  - from: arena/cases
    to: arena/cases
  # 0.8: the launcher that makes the containment of project code (native/nexus-launch), and the one-time
  # setup of the sandbox account. Real files on disk: one is started as a process, the others run elevated.
  - from: out/native/nexus-launch.exe
    to: bin/nexus-launch.exe
  # 0.9: the helper that reads the Wi-Fi state and reconnects a saved profile (native/nexus-wlan).
  - from: out/native/nexus-wlan.exe
    to: bin/nexus-wlan.exe
  # The POSIX shell of the isolated profile (vendor/busybox, GPL-2.0): it runs inside the AppContainer.
  - from: out/native/busybox.exe
    to: bin/busybox.exe
  - from: vendor/busybox
    to: bin/busybox-license
    filter:
      - README.md
      - COPYING
  - from: native/sandbox-setup
    to: sandbox-setup
asar: true
# claude.exe must be a real file on disk to be spawned, and the SQLite binding must be loadable.
asarUnpack:
  - "**/node_modules/@anthropic-ai/claude-agent-sdk-win32-x64/**"
  - "**/node_modules/better-sqlite3/**"
# better-sqlite3 13 ships an N-API prebuild; no rebuild against Electron headers is needed.
npmRebuild: false
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  artifactName: NEXUS-Setup-${version}.${ext}
