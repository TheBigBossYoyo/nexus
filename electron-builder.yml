appId: dev.nexus.controlplane
productName: NEXUS
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  # Only the Windows x64 runtime binary ships; other platform packages are not installed on Windows.
  - "!**/node_modules/@anthropic-ai/claude-agent-sdk-{darwin,linux}*/**"
  - "!**/*.map"
  # The runtime hosted by plain Node exists for tests; it is not part of the app.
  - "!out/main/runtime-node.js"
  - "!out/validation/**"
  - "!**/better-sqlite3/{deps,src}/**"
  # The SQLite binding for other systems: a Windows package has no use for them.
  - "!**/better-sqlite3/prebuilds/{darwin,linux,linuxmusl}-*"
  - "!**/better-sqlite3/prebuilds/win32-arm64.node"
# The built-in Arena cases (fixtures and hidden evaluators) are plain files NEXUS copies and executes.
extraResources:
  - from: arena/cases
    to: arena/cases
  # 0.8: the launcher that makes the containment of project code (native/nexus-launch), and the one-time
  # setup of the sandbox account. Real files on disk: one is started as a process, the others run elevated.
  - from: out/native/nexus-launch.exe
    to: bin/nexus-launch.exe
  # 0.9: the helper that reads the Wi-Fi state and reconnects a saved profile (native/nexus-wlan).
  - from: out/native/nexus-wlan.exe
    to: bin/nexus-wlan.exe
  # 0.9.1: the SIP endpoint of the Director's voice line (native/nexus-sip) and the Linphone libraries it loads
  # (AGPL-3.0-or-later; fetched by scripts/fetch-linphone-sdk.mjs, with their licences and NOTICE.txt). A program
  # of its own, started as a process; the libraries are real files next to it.
  - from: out/native/nexus-sip.exe
    to: bin/nexus-sip.exe
  - from: vendor/linphone-sdk/win64
    to: linphone
  # 0.9.1: the temporary administrator broker of a privilege session and its relay (native/nexus-elevate). Started
  # elevated once per session, with the owner's UAC consent; never a service, never left running.
  - from: out/native/nexus-elevate.exe
    to: bin/nexus-elevate.exe
  # 0.9.1: the meter of what NEXUS's work shows on the owner's screen (native/nexus-presence): reads window classes
  # and the foreground, changes nothing.
  - from: out/native/nexus-presence.exe
    to: bin/nexus-presence.exe
  # The privilege acceptance fixture (a folder and a registry key of NEXUS's own name; never in a session by default).
  - from: native/privilege-fixture
    to: privilege-fixture
  # 0.9.1: the speech models of the voice line (scripts/fetch-speech-models.mjs), with their NOTICE.txt.
  - from: vendor/speech-models
    to: speech-models
  # The POSIX shell of the isolated profile (vendor/busybox, GPL-2.0): it runs inside the AppContainer.
  - from: out/native/busybox.exe
    to: bin/busybox.exe
  - from: vendor/busybox
    to: bin/busybox-license
    filter:
      - README.md
      - COPYING
  - from: native/sandbox-setup
    to: sandbox-setup
asar: true
# claude.exe must be a real file on disk to be spawned, and the SQLite binding must be loadable.
asarUnpack:
  - "**/node_modules/@anthropic-ai/claude-agent-sdk-win32-x64/**"
  - "**/node_modules/better-sqlite3/**"
  # 0.9.1: the speech engine of the voice line is a native module, and its worker is started as a file.
  - "**/node_modules/sherpa-onnx-node/**"
  - "**/node_modules/sherpa-onnx-win-x64/**"
  - "out/main/speech-worker.js"
  - "out/main/chunks/**"
# better-sqlite3 13 ships an N-API prebuild; no rebuild against Electron headers is needed.
npmRebuild: false
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  artifactName: NEXUS-Setup-${version}.${ext}
